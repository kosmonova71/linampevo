target-version = "py312"
line-length = 99

extend-exclude = [
    ".venv",
    ".git",
    "build",
    "__pycache__",
    ".extension",
    "brain.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "presets",
    "theme",
    "shaders",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "BLE001",  # blind except is intentional in many places
    "S110",    # try-except-pass is intentional
    "S112",    # try-except-continue is intentional
    "PIE790",  # unnecessary pass
    "E501",    # line length managed per-file
]